<title>N3 한자 카드 50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 줄 헤더(진도) → 14일 스트립 → 오늘 할 일 → 카드 그리드(카드·버튼·비슷한 말이 한 묶음) */
:root{
  --paper:#f2f3f7; --card:#ffffff; --ink:#1c2340; --muted:#5b6482; --line:#d8dbe6;
  --ai:#2d47a6; --ai-soft:#e5e9f7; --shu:#cf432c; --ok:#2f7a54;
  --f-kanji:"Klee One","Zen Kaku Gothic New","Hiragino Mincho ProN",serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f121c; --card:#181c2b; --ink:#e6e8f2; --muted:#9aa2bf; --line:#2a3046;
  --ai:#94a6ff; --ai-soft:#1f2642; --shu:#ff7a62; --ok:#6fd19c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f121c; --card:#181c2b; --ink:#e6e8f2; --muted:#9aa2bf; --line:#2a3046;
  --ai:#94a6ff; --ai-soft:#1f2642; --shu:#ff7a62; --ok:#6fd19c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:grid;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
.brand h1{font-family:var(--f-kanji);font-size:clamp(1.7rem,4vw,2.3rem);letter-spacing:.02em}
.brand p{margin:4px 0 0;color:var(--muted)}
.progress{min-width:0;flex:0 1 280px;display:grid;gap:6px}
.progress .num{font-variant-numeric:tabular-nums;font-weight:600}
.progress .num small{color:var(--muted);font-weight:400}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;cursor:pointer;display:grid;gap:2px;justify-items:center;text-align:center;min-width:0}
.day b{font-variant-numeric:tabular-nums;font-size:.95rem}
.day span{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day.rev{background:var(--ai-soft)}
.day[aria-pressed="true"]{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.day.done b::after{content:"済";font-family:var(--f-kanji);color:var(--shu);font-size:.7rem;margin-left:3px;vertical-align:top}

.today{display:grid;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px}
.today-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.today h2{font-size:1.15rem}
.today ol{margin:0;padding-left:1.2em;color:var(--muted)}
.prompt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prompt code{flex:1 1 320px;min-width:0;font-family:var(--f-jp);font-size:.9rem;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;user-select:all;overflow-wrap:anywhere}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--card)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters .btn[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px 16px}
.item{display:grid;gap:8px;align-content:start;min-width:0}
.flip{perspective:1100px;cursor:pointer;border-radius:14px}
.inner{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:12.5rem;padding:14px 16px;display:grid;min-width:0}
.front{grid-template-rows:auto 1fr auto;justify-items:center;position:relative}
.meta{justify-self:stretch;display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.kanji{font-family:var(--f-kanji);font-size:clamp(2.6rem,9vw,3.4rem);line-height:1.1;align-self:center;text-align:center;overflow-wrap:anywhere}
.hint{font-size:.75rem;color:var(--muted)}
.stamp{position:absolute;right:12px;bottom:10px;width:34px;height:34px;border:2px solid var(--shu);color:var(--shu);border-radius:50%;display:grid;place-items:center;font-family:var(--f-kanji);font-size:1rem;transform:rotate(-12deg)}
.back{transform:rotateY(180deg);align-content:start;gap:6px}
.kana{font-family:var(--f-jp);font-size:1.5rem;font-weight:700;line-height:1.2}
.kr{display:inline-block;background:var(--ai-soft);color:var(--ai);border-radius:6px;padding:1px 8px;font-weight:600;font-size:.9rem;justify-self:start}
.mean{font-size:1.15rem;font-weight:600}
.mean small{color:var(--muted);font-weight:400;font-size:.78rem;margin-left:6px}
.ex{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;display:grid;gap:2px}
.ex .j{font-family:var(--f-jp);font-size:.95rem}
.ex .k{color:var(--muted);font-size:.85rem}

.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions .btn{padding:4px 10px;font-size:.8rem;display:inline-flex;gap:5px;align-items:center}
.actions svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.know[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);font-weight:600}

.rel{display:grid;gap:4px}
.rel h3{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
.rel ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rel button{width:100%;text-align:left;border:0;border-left:2px solid var(--line);background:transparent;padding:3px 0 3px 10px;cursor:pointer;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;border-radius:0}
.rel button:hover{border-left-color:var(--ai)}
.rel .w{font-family:var(--f-jp);font-weight:700}
.rel .r{font-family:var(--f-jp);color:var(--muted);font-size:.82rem}
.rel .m{font-size:.85rem}
.rel .m em{font-style:normal;color:var(--ai);font-size:.78rem;margin-right:4px}

.empty{color:var(--muted);padding:24px 0}
footer{color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
footer p{margin:0;max-width:70ch}

@media (max-width:520px){.days{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day span{display:none}}
@media (prefers-reduced-motion:reduce){.inner,.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>N3 한자 카드 50</h1>
      <p>2주 완성 · 하루 5장 · 카드를 누르면 뒤집혀요</p>

  <div class="tools">
    <div class="filters" id="filters">

  <footer>
    <p>한글 발음의 "-"는 앞 소리를 길게 늘이라는 뜻이에요. 예: 요-이 = よーい</p>

    <p>이 50장은 N3에 자주 나오는 한자 단어로 시작하는 출발점이에요. 시험 범위 전체(한자 약 600자 이상)를 대신하지는 않아요.</p>
  </footer>
</div>

 ["戻る","もどる","모도루","돌아오다","동사","すぐ戻ります。","금방 돌아올게요.",[["帰る","かえる","카에루","돌아가다"],["返す","かえす","카에스","돌려주다"],["戻す","もどす","모도스","되돌리다"]]],

 ["便利","べんり","벤리","편리함","な형용사","スマホはとても便利です。","스마트폰은 정말 편리해요.",[["不便","ふべん","후벤","불편함"],["簡単","かんたん","칸탄","간단함"],["役に立つ","やくにたつ","야쿠니타츠","도움이 되다"]]],
 ["複雑","ふくざつ","후쿠자츠","복잡함","な형용사","この問題は複雑だ。","이 문제는 복잡하다.",[["単純","たんじゅん","탄쥰","단순함"],["難しい","むずかしい","무즈카시-","어렵다"],["混乱","こんらん","콘란","혼란"]]],
 ["丁寧","ていねい","테이네이","정중함, 꼼꼼함","な형용사","丁寧に書いてください。","정성껏 써 주세요.",[["親切","しんせつ","신세츠","친절함"],["失礼","しつれい","시츠레이","실례"],["敬語","けいご","케이고","존댓말"]]],
 ["正しい","ただしい","타다시-","올바르다","い형용사","正しい答えを選んでください。","올바른 답을 고르세요.",[["間違える","まちがえる","마치가에루","틀리다"],["正確","せいかく","세이카쿠","정확함"],["確か","たしか","타시카","확실함, 아마"]]],
 ["細かい","こまかい","코마카이","잘다, 세세하다","い형용사","細かいお金がありますか。","잔돈 있어요?",[["小さい","ちいさい","치-사이","작다"],["詳しい","くわしい","쿠와시-","자세하다"],["細い","ほそい","호소이","가늘다"]]],

 ["掃除","そうじ","소-지","청소","명사·する","日曜日に部屋を掃除します。","일요일에 방을 청소해요.",[["洗濯","せんたく","센타쿠","빨래"],["片付ける","かたづける","카타즈케루","정리하다"],["汚い","きたない","키타나이","더럽다"]]],
 ["料理","りょうり","료-리","요리","명사·する","母の料理はおいしい。","엄마 요리는 맛있다.",[["材料","ざいりょう","자이료-","재료"],["焼く","やく","야쿠","굽다"],["味","あじ","아지","맛"]]],
 ["生活","せいかつ","세이카츠","생활","명사·する","日本の生活に慣れましたか。","일본 생활에 익숙해졌어요?",[["暮らす","くらす","쿠라스","살다, 지내다"],["慣れる","なれる","나레루","익숙해지다"],["習慣","しゅうかん","슈-칸","습관"]]],
 ["値段","ねだん","네단","가격","명사","この服の値段はいくらですか。","이 옷 가격은 얼마예요?",[["料金","りょうきん","료-킨","요금"],["安い","やすい","야스이","싸다"],["払う","はらう","하라우","지불하다"]]],
 ["忘れる","わすれる","와스레루","잊다, 두고 오다","동사","傘を電車に忘れた。","우산을 전철에 두고 내렸다.",[["覚える","おぼえる","오보에루","외우다"],["思い出す","おもいだす","오모이다스","떠올리다"],["落とす","おとす","오토스","떨어뜨리다, 잃어버리다"]]],

 ["天気","てんき","텐키","날씨","명사","明日の天気は雨らしい。","내일은 비가 온대.",[["天気予報","てんきよほう","텐키요호-","일기예보"],["晴れる","はれる","하레루","맑아지다"],["曇る","くもる","쿠모루","흐려지다"]]],
 ["季節","きせつ","키세츠","계절","명사","一番好きな季節は秋です。","제일 좋아하는 계절은 가을이에요.",[["春","はる","하루","봄"],["涼しい","すずしい","스즈시-","선선하다"],["暖かい","あたたかい","아타타카이","따뜻하다"]]],
 ["具合","ぐあい","구아이","(몸) 상태","명사","体の具合はどうですか。","몸 상태는 어때요?",[["調子","ちょうし","쵸-시","컨디션"],["病気","びょうき","뵤-키","병"],["熱","ねつ","네츠","열"]]],
 ["痛い","いたい","이타이","아프다","い형용사","頭が痛いです。","머리가 아파요.",[["怪我","けが","케가","부상, 다침"],["薬","くすり","쿠스리","약"],["治る","なおる","나오루","낫다"]]],
 ["疲れる","つかれる","츠카레루","피곤하다, 지치다","동사","今日はとても疲れた。","오늘은 정말 피곤했다.",[["休む","やすむ","야스무","쉬다"],["眠い","ねむい","네무이","졸리다"],["元気","げんき","겐키","기운, 건강"]]],

 ["理由","りゆう","리유-","이유","명사","遅れた理由を教えてください。","늦은 이유를 알려 주세요.",[["原因","げんいん","겐인","원인"],["目的","もくてき","모쿠테키","목적"],["訳","わけ","와케","이유, 사정"]]],
 ["関係","かんけい","칸케이","관계","명사","それは私には関係ない。","그건 나랑 상관없어.",[["関心","かんしん","칸신","관심"],["関する","かんする","칸스루","~에 관하다"],["影響","えいきょう","에이쿄-","영향"]]],
 ["変化","へんか","헨카","변화","명사·する","町の様子が大きく変化した。","동네 모습이 크게 변했다.",[["変わる","かわる","카와루","바뀌다"],["変える","かえる","카에루","바꾸다"],["変","へん","헨","이상함"]]],
 ["自由","じゆう","지유-","자유","명사·な형용사","週末は自由な時間が多い。","주말에는 자유 시간이 많다.",[["自分","じぶん","지분","자기 자신"],["自然","しぜん","시젠","자연"],["勝手","かって","캇테","제멋대로"]]],
 ["約束","やくそく","야쿠소쿠","약속","명사·する","友達と会う約束をした。","친구와 만날 약속을 했다.",[["守る","まもる","마모루","지키다"],["破る","やぶる","야부루","어기다, 찢다"],["待ち合わせ","まちあわせ","마치아와세","만나기로 한 약속"]]]
].map((c,i)=>({id:i+1,day:Math.floor(i/5)+1,w:c[0],kana:c[1],kr:c[2],mean:c[3],pos:c[4],exJ:c[5],exK:c[6],rel:c[7]}));

const THEMES=["생활·시간","기본 동사","마음·감정","가족·사람","학교·일","장소·이동","상태 표현","집안 생활","날씨·몸","생각·관계"];
const DAYS=THEMES.map((t,i)=>({d:i+1,label:t,rev:false}))
 .concat([{d:11,label:"복습 1~5일",rev:true},{d:12,label:"복습 6~10일",rev:true},{d:13,label:"못 외운 것",rev:true},{d:14,label:"전체 섞기",rev:true}]);

const store={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get("n3c.known",[]));
let view=store.get("n3c.view","d1");
let order=C.map(c=>c.id);
const flipped=new Set();
const canSpeak="speechSynthesis" in window;

function speak(t){if(!canSpeak)return;try{const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("ja"));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function cardsFor(v){
  const by=id=>C[id-1];
  const list=order.map(by);
  if(v==="all")return list;
  if(v==="again"||v==="d13")return list.filter(c=>!known.has(c.id));
  const n=+v.slice(1);
  if(n<=10)return list.filter(c=>c.day===n);
  if(n===11)return list.filter(c=>c.day<=5);
  if(n===12)return list.filter(c=>c.day>5);
  return list;
}

function renderDays(){
  document.getElementById("days").innerHTML=DAYS.map(d=>{
    const done=d.d<=10&&C.filter(c=>c.day===d.d).every(c=>known.has(c.id));
    return `<button type="button" class="day${d.rev?" rev":""}${done?" done":""}" data-view="d${d.d}" aria-pressed="${view==="d"+d.d}"><b>D${d.d}</b><span>${d.label}</span></button>`}).join("");
  document.querySelectorAll("#filters .btn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));
}

function renderToday(){
  const el=document.getElementById("today");
  let title,steps,words=null;
  if(view==="all"){title="전체 50장";steps=["앞면만 보고 읽기와 뜻을 말해 보세요.","모르는 카드는 \"외웠어요\"를 누르지 말고 그대로 두세요."]}
  else if(view==="again"){title="아직 못 외운 카드 "+cardsFor("again").length+"장";steps=["여기 남은 카드가 0장이 될 때까지 반복하세요."]}
  else{
    const d=DAYS[+view.slice(1)-1];
    title=`${d.d}일차 · ${d.label}`;
    if(d.d<=10){
      words=C.filter(c=>c.day===d.d);
      steps=["앞면을 보고 읽기와 뜻을 떠올린 뒤 카드를 눌러 확인하세요.","\"예문 듣기\"를 누르고 예문을 소리 내어 3번 따라 읽으세요.","아래 프롬프트를 복사해서 Claude 음성 대화로 오늘 단어를 써 보세요 (10분).","자기 전에 다시 한 번 보고, 확실한 카드만 \"외웠어요\"를 누르세요."];
    }else if(d.d===13){steps=["\"외웠어요\"를 아직 안 누른 카드만 모았어요.","이 날은 새 단어 없이 여기만 끝내면 됩니다."]}
    else if(d.d===14){steps=["50장을 섞었어요. 앞면만 보고 전부 말할 수 있는지 마지막으로 점검하세요.","막힌 카드는 \"외웠어요\"를 풀고 다시 보세요."]}
    else{steps=["앞면만 보고 읽기·뜻·예문까지 말해 보세요.","\"비슷한 말\"까지 읽고 뜻을 말할 수 있으면 통과예요."]}
  }
  const prompt=words?`今日の単語は「${words.map(c=>c.w).join("・")}」です。この単語を使って、N3レベルの短い会話をしてください。私が間違えたら、会話の最後に直してください。`:"";
  el.innerHTML=`<div class="today-head"><h2>${esc(title)}</h2><span class="hint">${cardsFor(view).length}장</span></div>
    <ol>${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    ${words?`<div class="prompt"><code id="ptext">${esc(prompt)}</code><button type="button" class="btn primary" id="copy">Claude 프롬프트 복사</button></div>`:""}`;
  const cp=document.getElementById("copy");
  if(cp)cp.onclick=()=>{
    const done=()=>{cp.textContent="복사했어요";setTimeout(()=>cp.textContent="Claude 프롬프트 복사",1600)};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("ptext"));const s=getSelection();s.removeAllRanges();s.addRange(r);cp.textContent="선택됨, 길게 눌러 복사하세요"};
    try{navigator.clipboard.writeText(prompt).then(done,sel)}catch(e){sel()}
  };
}

function renderGrid(){
  const list=cardsFor(view),g=document.getElementById("grid");
  if(!list.length){g.innerHTML=`<p class="empty">남은 카드가 없어요. 전부 외웠습니다.</p>`;return}
  g.innerHTML=list.map(c=>`
  <article class="item" data-id="${c.id}">
    <div class="flip${flipped.has(c.id)?" on":""}" role="button" tabindex="0" aria-pressed="${flipped.has(c.id)}" aria-label="${esc(c.w)} 카드 뒤집기">
      <div class="inner">
        <div class="face front">
          <div class="meta"><span>D${c.day} · ${String(c.id).padStart(2,"0")}</span><span>${esc(c.pos)}</span></div>
          <div class="kanji" lang="ja">${esc(c.w)}</div>
          <div class="hint">눌러서 뒤집기</div>
          ${known.has(c.id)?'<div class="stamp" aria-label="외움">済</div>':""}
        </div>
        <div class="face back">
          <div class="kana" lang="ja">${esc(c.kana)}</div>
          <span class="kr">${esc(c.kr)}</span>
          <div class="mean">${esc(c.mean)}<small>${esc(c.pos)}</small></div>
          <div class="ex"><span class="j" lang="ja">${esc(c.exJ)}</span><span class="k">${esc(c.exK)}</span></div>
        </div>
      </div>
    </div>
    <div class="actions">
      ${canSpeak?`<button type="button" class="btn" data-say="${esc(c.kana)}">${icon}단어 듣기</button><button type="button" class="btn" data-say="${esc(c.exJ)}">${icon}예문 듣기</button>`:""}
      <button type="button" class="btn know" data-know="${c.id}" aria-pressed="${known.has(c.id)}">${known.has(c.id)?"외웠어요 ✓":"외웠어요"}</button>
    </div>
    <div class="rel">
      <h3>비슷한 말</h3>
      <ul>${c.rel.map(r=>`<li><button type="button" data-say="${esc(r[1])}" lang="ja"><span class="w">${esc(r[0])}</span><span class="r">${r[0]===r[1]?"":esc(r[1])+" · "}${esc(r[2])}</span><span class="m" lang="ko">${esc(r[3])}</span></button></li>`).join("")}</ul>
    </div>
  </article>`).join("");
}

function renderProgress(){
  document.getElementById("pnum").innerHTML=`${known.size} <small>/ 50 외움</small>`;
  document.getElementById("pbar").style.width=(known.size/50*100)+"%";
}
function render(){renderDays();renderToday();renderGrid();renderProgress()}

function setView(v){view=v;store.set("n3c.view",v);if(v==="d14")shuffle(order);else order=C.map(c=>c.id);flipped.clear();render();}
document.addEventListener("click",e=>{
  const dv=e.target.closest("[data-view]");if(dv){setView(dv.dataset.view);return}
  const s=e.target.closest("[data-say]");if(s){speak(s.dataset.say);return}
  const k=e.target.closest("[data-know]");if(k){const id=+k.dataset.know;known.has(id)?known.delete(id):known.add(id);store.set("n3c.known",[...known]);render();return}
  const f=e.target.closest(".flip");if(f)toggle(f);
});
document.addEventListener("keydown",e=>{const f=e.target.closest&&e.target.closest(".flip");if(f&&(e.key==="Enter"||e.key===" ")){e.preventDefault();toggle(f)}});
function toggle(f){const id=+f.closest(".item").dataset.id;const on=!flipped.has(id);on?flipped.add(id):flipped.delete(id);f.classList.toggle("on",on);f.setAttribute("aria-pressed",on)}
document.getElementById("shuffle").onclick=()=>{shuffle(order);renderGrid()};
document.getElementById("reset").onclick=()=>{flipped.clear();document.querySelectorAll(".flip.on").forEach(f=>{f.classList.remove("on");f.setAttribute("aria-pressed","false")})};
if(canSpeak)try{speechSynthesis.getVoices()}catch(e){}
if(!DAYS.some(d=>"d"+d.d===view)&&view!=="all"&&view!=="again")view="d1";
if(view==="d14")shuffle(order);
render();
</script>
