<title>N3 빈출 정리 기록판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 고정 분류 버튼 줄(문법·바꿔 말하기·가타카나·부사) + 발음 토글 → 카드 그리드(앞: 표현+예문 / 뒤: 뜻·바꿔 말하기·예문 뜻) */
:root{
  --paper:#f2f3f7; --card:#ffffff; --ink:#1c2340; --muted:#5b6482; --line:#d8dbe6;
  --ai:#2d47a6; --ai-soft:#e5e9f7; --shu:#cf432c; --ok:#2f7a54;
  --f-kanji:"Klee One","Zen Kaku Gothic New","Hiragino Mincho ProN",serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f121c; --card:#181c2b; --ink:#e6e8f2; --muted:#9aa2bf; --line:#2a3046;
  --ai:#94a6ff; --ai-soft:#1f2642; --shu:#ff7a62; --ok:#6fd19c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f121c; --card:#181c2b; --ink:#e6e8f2; --muted:#9aa2bf; --line:#2a3046;
  --ai:#94a6ff; --ai-soft:#1f2642; --shu:#ff7a62; --ok:#6fd19c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
rt{font-size:.58em;color:var(--muted);font-weight:400}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.days{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:10px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 2px;cursor:pointer;display:grid;gap:1px;justify-items:center;min-width:0}
.day b{font-variant-numeric:tabular-nums;font-size:.98rem;letter-spacing:.02em}
.day small{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--card)}
.day[aria-pressed="true"] small{color:var(--card);opacity:.85}
.day.done:not([aria-pressed="true"]) small{color:var(--ok);font-weight:600}
.day.talk{background:var(--ai-soft)}

.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px}
.item{display:grid;gap:8px;align-content:start;min-width:0}
.flip{perspective:1100px;cursor:pointer;border-radius:14px}
.inner{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:15rem;padding:14px 16px;display:grid;min-width:0}
.front{grid-template-rows:auto 1fr auto;justify-items:center;position:relative}
.meta{justify-self:stretch;display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.kanji{font-family:var(--f-kanji);font-size:clamp(2.6rem,9vw,3.4rem);line-height:1.1;align-self:center;text-align:center;overflow-wrap:anywhere}
.kanji rt{font-family:var(--f-jp);font-size:.3em;font-weight:500;letter-spacing:.05em;color:var(--ai)}
.nofuri rt{visibility:hidden}
.fex{justify-self:stretch;border-top:1px dashed var(--line);padding-top:8px;font-family:var(--f-jp);font-size:.95rem;line-height:2;text-align:center}
.day.furi,.day.furi[aria-pressed]{background:var(--card);color:var(--ink);border-color:var(--line)}
.day.furi[aria-pressed="true"] small{color:var(--ai);opacity:1;font-weight:600}
.day.furi[aria-pressed="false"],.day.furi[aria-pressed="false"] small{color:var(--muted)}
.stamp{position:absolute;right:12px;bottom:10px;width:34px;height:34px;border:2px solid var(--shu);color:var(--shu);border-radius:50%;display:grid;place-items:center;font-family:var(--f-kanji);font-size:1rem;transform:rotate(-12deg)}
.back{transform:rotateY(180deg);align-content:start;gap:6px;border-color:var(--ai)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.kana{font-family:var(--f-jp);font-size:1.4rem;font-weight:700;line-height:1.2}
.kr{background:var(--ai-soft);color:var(--ai);border-radius:6px;padding:1px 8px;font-weight:600;font-size:.88rem}
.mean{font-size:1.08rem;font-weight:600}
.mean small{color:var(--muted);font-weight:400;font-size:.76rem;margin-left:6px}
.ex{border-top:1px solid var(--line);padding-top:6px;display:grid}
.ex .j{font-family:var(--f-jp);font-size:.95rem;line-height:2}
.ex .k{color:var(--muted);font-size:.84rem}
.rel{border-top:1px solid var(--line);padding-top:6px;display:grid;gap:3px}
.rel h3{margin:0;font-size:.7rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
.rel ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.rel li{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;border-left:2px solid var(--line);padding-left:8px}
.rel .w{font-family:var(--f-jp);font-weight:700}
.rel .r{font-family:var(--f-jp);color:var(--muted);font-size:.8rem}
.rel .m{font-size:.84rem}

.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.8rem;display:inline-flex;gap:5px;align-items:center}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--card);padding:6px 12px;font-size:.88rem}
.btn svg,.play svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.know[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);font-weight:600}

.cast{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.cast b{font-family:var(--f-jp);color:var(--ink)}
.scenes{display:grid;gap:28px}
.scene{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 28px;border-top:1px solid var(--line);padding-top:18px}
.scene-head{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.scene-head .no{font-family:var(--f-kanji);color:var(--shu);font-size:1.3rem}
.scene-head h2{margin:0;font-size:1.15rem}
.scene-head p{margin:0;color:var(--muted);flex-basis:100%}
.dia{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.line{display:grid;grid-template-columns:4.2rem minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.who{font-family:var(--f-jp);font-size:.8rem;color:var(--ai);font-weight:700;padding-top:.5em}
.say{display:grid;min-width:0}
.say .j{font-family:var(--f-jp);font-size:1.02rem;line-height:2}
.say .k{color:var(--muted);font-size:.84rem}
.play{border:1px solid var(--line);background:var(--card);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;margin-top:.3em}
.side{display:grid;gap:12px;align-content:start;min-width:0}
.side h3,.mynote h3{margin:0;font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
.keys{display:grid;gap:6px}
.key{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;border-left:2px solid var(--shu);padding-left:10px}
.key b{font-family:var(--f-jp)}
.key .r{font-size:.8rem;color:var(--ai)}
.key .m{font-size:.85rem;color:var(--muted);flex-basis:100%}
.prompt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prompt h3,.prompt code{flex-basis:100%}
.prompt code{min-width:0;font-family:var(--f-jp);font-size:.88rem;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;user-select:all;overflow-wrap:anywhere}
.mynote{margin-top:28px;display:grid;gap:10px;border:1px dashed var(--line);border-radius:14px;padding:16px;background:var(--card)}
.mynote textarea{width:100%;min-height:6rem;font-family:var(--f-jp);font-size:.95rem;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);color:var(--ink);resize:vertical}
@media (max-width:760px){.scene{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.days{gap:4px;padding-inline:12px}.day b{font-size:.85rem}.day small{font-size:.62rem}}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
.speaking{border-color:var(--ai)!important;color:var(--ai)!important}
.kanji.g{font-family:var(--f-jp);font-weight:700;font-size:clamp(1.6rem,6vw,2rem)}
.kanji.k{font-family:var(--f-jp);font-weight:700;font-size:clamp(1.8rem,7vw,2.3rem)}
.para{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:.9rem}
.para b{font-family:var(--f-jp);color:var(--ai)}
.para span{color:var(--muted);font-size:.78rem}
.lead{max-width:1120px;margin:0 auto;padding-inline:16px;padding-top:14px;color:var(--muted);font-size:.82rem}
.logbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.logbtn:hover{border-color:var(--ai)}
#logp{position:fixed;inset:0;z-index:30;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#logp[hidden]{display:none!important}
#logp .sheet{background:var(--card);color:var(--ink);border-radius:16px;width:100%;max-width:520px;max-height:80vh;overflow:auto;padding:16px;display:grid;gap:12px}
#logp .sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
#logp h2{margin:0;font-size:1.05rem}
#logp pre{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:.9rem;line-height:1.7;background:var(--paper);border-radius:10px;padding:12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#logp .sh-act{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
#logp .btn.primary{background:var(--ai);border-color:var(--ai);color:var(--card);padding:6px 14px}
.wrap{padding-bottom:88px}
</style>
<h1 class="sr">N3 빈출 정리</h1>
<nav class="top" aria-label="분류"><div class="days" id="days"></div></nav>
<p class="lead" id="lead"></p>
<div class="wrap"><main class="grid" id="grid"></main></div>

function furi(w,k){

  const re=new RegExp("^"+segs.map(x=>/[\u3400-\u9fff々〆ヶ]/.test(x)?"(.+?)":"("+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")").join("")+"$");

function speak(texts,btn){

  try{

}

  const dv=e.target.closest("[data-view]");if(dv){view=dv.dataset.view;store.set("top.v",view);flipped.clear();render();window.scrollTo(0,0);return}
  const s=e.target.closest("[data-say]");if(s){const it=s.closest(".item");logHit(it?+it.dataset.id:0,"l");speak(s.dataset.say.split("|"),s);return}
  const k=e.target.closest("[data-know]");if(k){const id=+k.dataset.know;known.has(id)?known.delete(id):known.add(id);store.set("top.known",[...known]);render();return}
  const f=e.target.closest(".flip");if(f)toggle(f);
});
document.addEventListener("keydown",e=>{const f=e.target.closest&&e.target.closest(".flip");if(f&&(e.key==="Enter"||e.key===" ")){e.preventDefault();toggle(f)}});
const LOGK="top.log";
let LOG=store.get(LOGK,null);if(!LOG||typeof LOG!=="object"||!LOG.c||!LOG.d)LOG={c:{},d:{}};
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function logHit(id,kind){
  const t=ymd(new Date()),day=LOG.d[t]||(LOG.d[t]={f:0,l:0,ids:[]});
  day[kind]=(day[kind]||0)+1;
  if(id){const c=LOG.c[id]||(LOG.c[id]={f:0,l:0});c[kind]=(c[kind]||0)+1;if(!day.ids.includes(id))day.ids.push(id)}
  store.set(LOGK,LOG);
}
function streak(){let n=0;const d=new Date();if(!LOG.d[ymd(d)])d.setDate(d.getDate()-1);while(LOG.d[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function summary(){
  const t=ymd(new Date()),td=LOG.d[t]||{f:0,l:0,ids:[]},days=Object.keys(LOG.d).sort();
  let F=0,L=0;days.forEach(k=>{F+=LOG.d[k].f||0;L+=LOG.d[k].l||0});
  const seen=Object.keys(LOG.c).filter(id=>(LOG.c[id].f||0)>0).length,total=C.length;
  const lines=[`[${"N3 빈출 정리"} 학습 기록] ${t.slice(5).replace("-","/")} 기준`,
    `공부한 날 ${days.length}일 · 연속 ${streak()}일`,
    `오늘: 카드 뒤집기 ${td.f||0}회 (${td.ids.length}장) · 듣기 ${td.l||0}회`,
    `누적: 카드 뒤집기 ${F}회 · 듣기 ${L}회`,
    `뒤집어 본 카드 ${seen}/${total}장 · 외운 카드 ${known.size}/${total}장`];
  const g="분류별 외운 카드: "+SEC.map(([k,a])=>{const all=C.filter(c=>c.s===k);return a+" "+all.filter(c=>known.has(c.id)).length+"/"+all.length}).join(" · ");if(g)lines.push(g);
  const recent=days.slice(-7);
  if(recent.length){lines.push("","최근 날짜별");recent.forEach(k=>{const v=LOG.d[k];lines.push(`${k.slice(5).replace("-","/")}  뒤집기 ${v.f||0} · 듣기 ${v.l||0} · ${v.ids.length}장`)})}
  const top=Object.keys(LOG.c).map(id=>({id:+id,n:(LOG.c[id].f||0)+(LOG.c[id].l||0),f:LOG.c[id].f||0,l:LOG.c[id].l||0})).filter(x=>C[x.id-1]).sort((a,b)=>b.n-a.n).slice(0,5);
  if(top.length){lines.push("","많이 본 카드 (뒤집기·듣기)");top.forEach(x=>lines.push(`${C[x.id-1].w}  ${x.f}·${x.l}`))}
  return lines.join("\n");
}
function openLog(){
  let p=document.getElementById("logp");
  if(!p){p=document.createElement("div");p.id="logp";p.setAttribute("role","dialog");p.setAttribute("aria-modal","true");p.setAttribute("aria-label","내 학습 기록");
    p.innerHTML=`<div class="sheet"><div class="sh-head"><h2>내 학습 기록</h2><button type="button" class="btn" data-logclose>닫기</button></div><pre id="logtxt"></pre><div class="sh-act"><button type="button" class="btn primary" id="logcopy">기록 복사</button><span class="hint">이 폰의 브라우저에만 저장돼요.</span></div></div>`;
    document.body.appendChild(p);
    p.addEventListener("click",e=>{if(e.target===p||e.target.closest("[data-logclose]"))p.hidden=true});
    document.getElementById("logcopy").onclick=e=>{const b=e.currentTarget,el=document.getElementById("logtxt"),lab="기록 복사";
      const ok=()=>{b.textContent="복사했어요";setTimeout(()=>b.textContent=lab,1600)};
      const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="선택됨, 길게 눌러 복사하세요"};
      try{navigator.clipboard.writeText(el.textContent).then(ok,sel)}catch(_){sel()}};
  }
  document.getElementById("logtxt").textContent=summary();p.hidden=false;
}
(function(){const b=document.createElement("button");b.type="button";b.className="logbtn";b.textContent="내 기록";b.onclick=openLog;document.body.appendChild(b)})();
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const p=document.getElementById("logp");if(p)p.hidden=true}});

render();
</script>
