<title>회화 대본 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 고정 버튼 줄(대본 3개 + 발음·해석·가리기 토글) → 말풍선 대본(AI 왼쪽, 나 오른쪽) → AI 프롬프트 2단계 */
:root{
  --paper:#f2f3f7; --card:#ffffff; --ink:#1c2340; --muted:#5b6482; --line:#d8dbe6;
  --ai:#2d47a6; --ai-soft:#e5e9f7; --me:#2f7a54; --me-soft:#e3f2ea; --shu:#cf432c;
  --f-kanji:"Klee One","Zen Kaku Gothic New","Hiragino Mincho ProN",serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f121c; --card:#181c2b; --ink:#e6e8f2; --muted:#9aa2bf; --line:#2a3046;
  --ai:#94a6ff; --ai-soft:#1f2642; --me:#6fd19c; --me-soft:#16302a; --shu:#ff7a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f121c; --card:#181c2b; --ink:#e6e8f2; --muted:#9aa2bf; --line:#2a3046;
  --ai:#94a6ff; --ai-soft:#1f2642; --me:#6fd19c; --me-soft:#16302a; --shu:#ff7a62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
rt{font-size:.55em;color:var(--muted);font-weight:400}
.nofuri rt{visibility:hidden}
.nokr .kr{display:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.b{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 2px;cursor:pointer;display:grid;gap:1px;justify-items:center;min-width:0}
.b b{font-size:.95rem}
.b small{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.b.sc[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--card)}
.b.sc[aria-pressed="true"] small{color:var(--card);opacity:.85}
.b.tg small{color:var(--ai);font-weight:600}
.b.tg.off small{color:var(--muted);font-weight:400}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:grid;gap:18px}
.head{display:grid;gap:4px}
.head h1{margin:0;font-size:1.25rem;text-wrap:balance}
.head p{margin:0;color:var(--muted);font-size:.9rem}
.roles{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}
.roles span{display:inline-flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%}

.chat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ln{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.ln.m{margin-left:auto;flex-direction:row-reverse}
.who{font-family:var(--f-jp);font-size:.72rem;color:var(--muted);flex:none;width:2.6rem;text-align:center;padding-bottom:6px}
.bub{border-radius:14px;padding:8px 12px;display:grid;gap:0;min-width:0;cursor:default}
.a .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.m .bub{background:var(--me-soft);border:1px solid transparent;border-bottom-right-radius:4px}
.jp{font-family:var(--f-jp);font-size:1.02rem;line-height:2}
.kr{color:var(--muted);font-size:.84rem}
.n{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hid .bub{cursor:pointer}
.hid .jp,.hid .kr{filter:blur(7px);user-select:none}
.hid .bub::after{content:"눌러서 보기";font-size:.72rem;color:var(--muted)}
.hid.peek .jp,.hid.peek .kr{filter:none}
.hid.peek .bub::after{content:""}
.play{flex:none;border:1px solid var(--line);background:var(--card);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;margin-bottom:4px}
.play svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}

.steps{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:18px}
.step{display:grid;gap:8px}
.step h2{margin:0;font-size:1rem;display:flex;gap:8px;align-items:baseline}
.step h2 span{font-family:var(--f-kanji);color:var(--shu)}
.step p{margin:0;color:var(--muted);font-size:.86rem}
.step code{display:block;font-family:var(--f-jp);font-size:.85rem;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:9.5rem;overflow:auto;user-select:all}
.copy{justify-self:start;border:1px solid var(--ai);background:var(--ai);color:var(--card);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.88rem}
@media (max-width:480px){.bar{gap:4px;padding-inline:12px}.b b{font-size:.85rem}.b small{font-size:.62rem}.ln{max-width:96%}.who{width:2.2rem}}
</style>

<script>

    return `<li class="ln ${x[0]}${h?" hid":""}"><span class="who" lang="ja">${isM?"나":esc(s.ai)}</span><div class="bub" ${h?'role="button" tabindex="0" aria-label="가린 대사 보기"':""}>${isM?`<span class="n">나 ${mi}</span>`:""}<span class="jp" lang="ja">${ruby(x[1])}</span><span class="kr">${esc(x[2])}</span></div>${canSpeak?`<button type="button" class="play" data-say="${esc(plain(x[1]))}" aria-label="듣기">${icon}</button>`:""}</li>`}).join("")}</ol>

    <div class="step"><h2><span>一</span>내 파트를 외운 뒤 · AI에게 대본 없이</h2><p>AI는 대본을 모르니 말이 조금씩 달라져요. 외운 내 대사를 상황에 맞게 바꿔 쓰는 연습이에요.</p><code id="c1" lang="ja">${esc(p1(s))}</code><button type="button" class="copy" data-copy="c1">1단계 프롬프트 복사</button></div>
    <div class="step"><h2><span>二</span>AI 파트를 외울 때 · AI에게 대본 주기</h2><p>역할을 바꿔서 AI가 "나" 대사를 하고, 내가 ${esc(s.ai)} 대사를 해요.</p><code id="c2" lang="ja">${esc(p2(s))}</code><button type="button" class="copy" data-copy="c2">2단계 프롬프트 복사</button></div>
  </section>`;
}
function copyFrom(btn,el){
  const label=btn.textContent;
  const ok=()=>{btn.textContent="복사했어요";setTimeout(()=>btn.textContent=label,1600)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const g=getSelection();g.removeAllRanges();g.addRange(r);btn.textContent="선택됨, 길게 눌러 복사하세요"};
  try{navigator.clipboard.writeText(el.textContent).then(ok,sel)}catch(e){sel()}
}
document.addEventListener("click",e=>{
  const sc=e.target.closest("[data-sc]");if(sc){cur=+sc.dataset.sc;store.set("sc.cur",cur);renderBar();renderMain();window.scrollTo(0,0);return}
  const t=e.target.closest("[data-t]");if(t){const k=t.dataset.t;
    if(k==="furi"){furi=!furi;store.set("sc.furi",furi);renderBar();return}
    if(k==="kr"){kr=!kr;store.set("sc.kr",kr);renderBar();return}
    if(k==="hide"){hide=NEXT[hide];store.set("sc.hide",hide);renderBar();renderMain();return}}
  const c=e.target.closest("[data-copy]");if(c){copyFrom(c,document.getElementById(c.dataset.copy));return}
  const p=e.target.closest("[data-say]");if(p){speak(p.dataset.say);return}
  const h=e.target.closest(".hid .bub");if(h){h.parentElement.classList.toggle("peek");return}
});
document.addEventListener("keydown",e=>{const h=e.target.closest&&e.target.closest(".hid .bub");if(h&&(e.key==="Enter"||e.key===" ")){e.preventDefault();h.parentElement.classList.toggle("peek")}});
if(canSpeak)try{speechSynthesis.getVoices()}catch(e){}
renderBar();renderMain();
</script>
